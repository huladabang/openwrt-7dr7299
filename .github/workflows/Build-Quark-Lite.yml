name: Build OpenList Quark Lite IPK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build aarch64_cortex-a53 packages
        uses: OpenListTeam/openwrt-gh-action-sdk@go1.25
        env:
          ARCH: aarch64_cortex-a53-openwrt-24.10
          FEEDNAME: quark_lite
          PACKAGES: luci-app-quark-lite
          NO_REFRESH_CHECK: true

      - name: Inspect package sizes
        run: |
          find bin/packages/aarch64_cortex-a53/quark_lite -type f \( -name '*.ipk' -o -name '*.apk' \) -exec ls -lh {} +
          du -ah bin/packages/aarch64_cortex-a53/quark_lite | sort -h | tail -20

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quark-lite-${{ github.run_number }}
          name: OpenList Quark Lite ${{ github.run_number }}
          body: |
            Experimental OpenWrt package based on OpenList 4.2.6.

            - Ordinary Quark storage driver only
            - Official lite frontend
            - Minimal LuCI start/stop page
            - WebDAV remains available through OpenList
            - Architecture: aarch64_cortex-a53, OpenWrt 24.10

            Install the backend package first, then the LuCI package.
            This AGPL-3.0 derivative is provided with its complete build source.
          files: |
            bin/packages/aarch64_cortex-a53/quark_lite/*.ipk
            bin/packages/aarch64_cortex-a53/quark_lite/*.apk
