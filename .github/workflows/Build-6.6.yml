name: Build TL-7DR7299 closed-source Wi-Fi firmware

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: Clear compiler cache before building
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tl-7dr7299-firmware
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  # Exact source revision used by the known-good Enshan image (r1-6b7374feb).
  SOURCE_COMMIT: 6b7374feb2c7e4b0a9486333578f2b8950008840
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo apt-get install -y dos2unix libfuse-dev
          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"

      - name: Prepare feeds and packages
        run: |
          cd "$OPENWRT_PATH"
          "$GITHUB_WORKSPACE/scripts/diy-script.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          "$GITHUB_WORKSPACE/scripts/diy-6.6.sh"

      - name: Generate configuration
        run: |
          cd "$OPENWRT_PATH"
          cp defconfig/mt7988_mt7992.config .config
          cat "$GITHUB_WORKSPACE/configs/6.6.txt" >> .config
          make defconfig
          grep -qx 'CONFIG_MTK_WIFI7_FIRST_IF_IPAILNA=y' .config
          grep -qx '# CONFIG_MTK_WIFI7_FIRST_IF_EPAELNA is not set' .config
          grep -qx 'CONFIG_MTK_WIFI7_SECOND_IF_EPAELNA=y' .config
          grep -E 'CONFIG_TARGET_.*7dr7299|CONFIG_PACKAGE_(luci-app-store|luci-app-openclash|luci-app-turboacc-mtk|luci-app-ttyd|luci-app-samba4|luci-app-nlbwmon|luci-app-upnp|luci-app-filemanager|kmod-tun|tailscale)=' .config

      - name: Restore compiler cache
        if: ${{ !inputs.clean_cache }}
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          mixkey: tl-7dr7299-mtwifi-6.6
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Download sources
        run: |
          cd "$OPENWRT_PATH"
          make download -j8
          find dl -size -1024c -print -delete

      - name: Compile firmware
        run: |
          cd "$OPENWRT_PATH"
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify and collect output
        run: |
          cd "$OPENWRT_PATH"
          output_dir="$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n1)"
          test -n "$output_dir"
          test -f "$output_dir"/*tplink_tl-7dr7299-v1-squashfs-sysupgrade.itb
          cp .config "$output_dir/build.config"
          find "$output_dir" -maxdepth 1 -type f ! -name 'sha256sums-custom' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$output_dir/sha256sums-custom"
          echo "OUTPUT_DIR=$OPENWRT_PATH/${output_dir#./}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL-7DR7299-mtwifi-${{ env.BUILD_DATE }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tl-7dr7299-${{ env.BUILD_DATE }}
          name: TL-7DR7299 closed-source Wi-Fi ${{ env.BUILD_DATE }}
          generate_release_notes: false
          body: |
            TP-Link TL-7DR7299 v1 custom ImmortalWrt firmware.

            - Source: padavanonly/immortalwrt-mt798x-6.6
            - Branch: mt798x-mt799x-6.6-mtwifi
            - Source revision: 6b7374feb (matched to the known-good Enshan image)
            - RF front end: first radio iPA/iLNA, second radio ePA/eLNA
            - Wi-Fi: MediaTek proprietary MT7992 driver
            - LAN address: 192.168.6.1
            - Initial root password: empty; set it immediately after first login
            - Included: iStore, OpenClash, TurboACC, ttyd, Samba4/USB storage,
              nlbwmon, UPnP, file manager, Tailscale and matching kmod-tun
          files: ${{ env.OUTPUT_DIR }}/*
